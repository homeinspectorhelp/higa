<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Player — Just Finished Home Inspector School</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --orange: #e84118;
    --orange-dark: #c93610;
    --dark: #1c1d1f;
    --medium: #6a6f73;
    --light-bg: #f7f9fa;
    --border: #d1d7dc;
    --highlight: #fff3e0;
    --green: #1e6055;
    --player-bg: #2d2f31;
  }

  html, body { height: 100%; }
  body {
    font-family: system-ui, "Segoe UI", -apple-system, sans-serif;
    color: var(--dark);
    background: #fff;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ── TOP NAV ── */
  .top-nav {
    height: 52px;
    background: var(--dark);
    color: #fff;
    display: flex;
    align-items: center;
    padding: 0 16px;
    gap: 16px;
    flex-shrink: 0;
  }
  .tn-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex-shrink: 1; }
  .tn-back {
    display: flex; align-items: center; color: #fff; text-decoration: none; flex-shrink: 0;
  }
  .tn-back svg { width: 20px; height: 20px; }
  .tn-back:hover { color: var(--orange); }
  .tn-title {
    font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tn-center {
    flex: 1; display: flex; align-items: center; gap: 10px; max-width: 360px; margin: 0 auto;
  }
  .tn-progress-track {
    flex: 1; height: 6px; background: #4a4c4f; border-radius: 3px; overflow: hidden;
  }
  .tn-progress-fill {
    height: 100%; width: 0%; background: var(--orange); border-radius: 3px;
    transition: width 0.35s ease;
  }
  .tn-progress-pct { font-size: 12px; color: #cdd2d6; white-space: nowrap; }
  .tn-right { display: flex; align-items: center; gap: 12px; margin-left: auto; flex-shrink: 0; }
  .tn-count { font-size: 13px; color: #cdd2d6; white-space: nowrap; }
  .tn-avatar {
    width: 30px; height: 30px; border-radius: 50%; background: var(--orange);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 800; flex-shrink: 0;
  }

  /* ── LAYOUT ── */
  .player-layout { display: flex; flex: 1; min-height: 0; align-items: stretch; }
  .lesson-main {
    width: 70%; overflow-y: auto; background: #fff;
  }
  .sidebar {
    width: 30%; min-width: 300px; max-width: 380px;
    border-left: 1px solid var(--border);
    background: #fff; overflow-y: auto;
    display: flex; flex-direction: column;
  }

  /* ── PLAYER ── */
  .player {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: var(--player-bg);
  }
  .player-inner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .play-btn {
    width: 76px; height: 76px; border-radius: 50%;
    background: var(--orange); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    transition: transform 0.15s, background 0.15s;
  }
  .play-btn:hover { transform: scale(1.06); background: var(--orange-dark); }
  .play-btn svg { width: 34px; height: 34px; color: #fff; }
  .player-caption {
    position: absolute; left: 16px; bottom: 14px; right: 16px;
    color: #fff; font-size: 14px; font-weight: 600;
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    display: flex; justify-content: space-between; align-items: flex-end; gap: 12px;
    pointer-events: none;
  }
  .player-caption .pc-dur { font-weight: 500; color: #e3e6e8; font-size: 13px; white-space: nowrap; }
  /* fake playback bar */
  .play-track {
    position: absolute; left: 0; right: 0; bottom: 0; height: 5px;
    background: rgba(255,255,255,0.2);
  }
  .play-track-fill {
    height: 100%; width: 0%; background: var(--orange);
  }
  .audio-tag {
    position: absolute; top: 14px; left: 16px;
    font-size: 11px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: rgba(255,255,255,0.7);
    display: flex; align-items: center; gap: 6px;
  }

  /* ── LESSON BODY ── */
  .lesson-body { padding: 28px 36px 48px; max-width: 820px; }
  .lesson-module-label {
    font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--medium); margin-bottom: 6px;
  }
  .lesson-h { font-size: 22px; font-weight: 800; margin-bottom: 16px; line-height: 1.3; }
  .lesson-text p { font-size: 15px; line-height: 1.7; margin-bottom: 16px; color: #2b2c2e; }

  .lesson-actions {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin: 28px 0 8px;
  }
  .btn-complete {
    background: var(--green); color: #fff; border: none; border-radius: 4px;
    padding: 12px 20px; font-size: 15px; font-weight: 700; cursor: pointer;
    display: flex; align-items: center; gap: 8px; transition: background 0.15s;
  }
  .btn-complete:hover { background: #174c43; }
  .btn-complete.done { background: #174c43; }
  .btn-complete svg { width: 18px; height: 18px; }

  .nav-buttons { display: flex; gap: 10px; margin-left: auto; }
  .btn-nav {
    background: #fff; border: 1.5px solid var(--dark); color: var(--dark);
    border-radius: 4px; padding: 11px 16px; font-size: 14px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 6px; transition: background 0.15s;
  }
  .btn-nav:hover:not(:disabled) { background: var(--light-bg); }
  .btn-nav:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-nav svg { width: 16px; height: 16px; }

  /* ── SIDEBAR ── */
  .sb-header {
    padding: 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
    position: sticky; top: 0; background: #fff; z-index: 2;
  }
  .sb-header h3 { font-size: 16px; font-weight: 800; }
  .sb-toggle-all {
    background: none; border: none; color: var(--orange); font-size: 13px; font-weight: 700;
    cursor: pointer;
  }
  .sb-toggle-all:hover { text-decoration: underline; }

  .sb-module { border-bottom: 1px solid var(--border); }
  .sb-mod-header {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px; cursor: pointer; background: var(--light-bg); user-select: none;
  }
  .sb-mod-header:hover { background: #eef1f3; }
  .sb-tri { width: 10px; font-size: 10px; transition: transform 0.2s; flex-shrink: 0; color: var(--dark); }
  .sb-module.open .sb-tri { transform: rotate(90deg); }
  .sb-mod-title { font-size: 13px; font-weight: 700; flex: 1; line-height: 1.35; }
  .sb-body { display: none; }
  .sb-module.open .sb-body { display: block; }

  .sb-lesson {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 11px 14px 11px 16px; cursor: pointer; border-top: 1px solid var(--border);
    text-decoration: none; color: var(--dark);
  }
  .sb-lesson:hover { background: var(--light-bg); }
  .sb-lesson.active { background: var(--highlight); }
  .sb-lesson.active .sb-l-title { font-weight: 700; }
  .sb-check {
    width: 18px; height: 18px; border: 1.5px solid var(--medium); border-radius: 3px;
    flex-shrink: 0; margin-top: 1px; display: flex; align-items: center; justify-content: center;
    background: #fff;
  }
  .sb-lesson.completed .sb-check { background: var(--green); border-color: var(--green); }
  .sb-check svg { width: 12px; height: 12px; color: #fff; display: none; }
  .sb-lesson.completed .sb-check svg { display: block; }
  .sb-l-info { flex: 1; min-width: 0; }
  .sb-l-title {
    font-size: 13px; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .sb-l-dur {
    font-size: 12px; color: var(--medium); margin-top: 3px;
    display: flex; align-items: center; gap: 5px;
  }
  .sb-l-dur svg { width: 12px; height: 12px; }

  /* ── RESPONSIVE ── */
  @media (max-width: 768px) {
    .player-layout { flex-direction: column; }
    .lesson-main { width: 100%; }
    .sidebar { width: 100%; max-width: none; min-width: 0; border-left: none; border-top: 1px solid var(--border); }
    .lesson-body { padding: 20px 18px 40px; }
    .tn-center { display: none; }
  }
</style>
</head>

<!-- TOP NAV -->
<div class="top-nav">

  <div class="tn-center">

<!-- LAYOUT -->
<div class="player-layout">

  <!-- MAIN -->
  <div class="lesson-main">
    <div class="player">
      <div class="audio-tag">
        <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3zm5 9a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-2.08A7 7 0 0019 12h-2z"/></svg>

      </div>
      <div class="player-inner">

    <div class="lesson-body">
      <div class="lesson-module-label" id="moduleLabel">MODULE</div>
      <h2 class="lesson-h" id="lessonTitle">Lesson title</h2>

      <div class="lesson-actions">
        <button class="btn-complete" id="completeBtn" onclick="markComplete()">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
          <span id="completeLabel">Mark as Complete</span>
        </button>
        <div class="nav-buttons">
          <button class="btn-nav" id="prevBtn" onclick="goPrev()">
            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>

          </button>
          <button class="btn-nav" id="nextBtn" onclick="goNext()">
            Next

  <!-- SIDEBAR -->
  <aside class="sidebar">

      <button class="sb-toggle-all" id="toggleAllBtn" onclick="toggleAll()">Collapse all</button>
    </div>
    <div id="sidebarBody"></div>
  </aside>

</div>

<script>
  var STORAGE_KEY = 'tip_completed_lessons';

  // ── LESSON DATA — 26 lessons, real home inspection content ──
  var LESSONS = [
    {
      id: 0, module: "Module 0", moduleTitle: "30-Day Quick Win Action Plan",
      title: "Week 1: Lay the Foundation (Days 1–7)", duration: "10 min",
      content: [
        "Your first week out of inspection school is the most important week of your career — not because of how many inspections you'll book, but because of the foundation you'll lay. Most new inspectors waste their first month chasing things that don't matter yet: a fancy website, business cards, a logo they'll redesign three times. This week is about the non-negotiables that everything else stands on.",
        "Over Days 1 through 7 you'll do five things: register your business and confirm your licensing and E&O insurance are active, set up a dedicated business phone number and email, choose your inspection software and report template, define your service area and base pricing, and write down the single sentence that describes who you serve and why. That sentence becomes your positioning for the entire course.",
        "Don't aim for perfect — aim for done. A foundation you can build on this week beats a perfect plan you start next month. By Friday you should be legally able to take a paid inspection and have the tools to deliver it professionally. That's the win for Week 1."
      ]

    {
      id: 1, module: "Module 0", moduleTitle: "30-Day Quick Win Action Plan",

        "The goal isn't a huge audience. It's that when someone hears your name and looks you up, they find a real, credible, easy-to-contact professional. That alone puts you ahead of most new inspectors who stay invisible for their first six months."
      ]
    },
    {
      id: 2, module: "Module 0", moduleTitle: "30-Day Quick Win Action Plan",
      title: "Week 3: Start Generating Leads (Days 15–21)", duration: "12 min",
      content: [
        "Now that you exist online and look credible, Week 3 turns attention into actual conversations. Leads for a new inspector rarely come from advertising — they come from relationships and from showing up consistently in front of the people who refer business.",
        "This week you'll build your first contact list: every agent you know, every person in your personal network who touches real estate, and any local pros (lenders, title reps, contractors) who serve home buyers. You'll reach out to ten of them personally — not with a sales pitch, but with a genuine introduction and an offer to help. You'll also schedule your first piece of recurring value: a short weekly post or email that keeps you top of mind.",
        "Track everything. The point of Week 3 isn't to close deals — it's to start the flywheel of conversations that turns into your first bookings. A handful of warm conversations now becomes your referral engine by month three."
      ]
    },
    {
      id: 3, module: "Module 0", moduleTitle: "30-Day Quick Win Action Plan",
      title: "Week 4: Solidify and Grow (Days 22–30)", duration: "11 min",
      content: [
        "The final week of your first month is about turning early momentum into repeatable systems. The difference between an inspector who's still scrambling in year two and one who's steadily growing usually comes down to what they systematize in these early days.",
        "This week you'll document your booking-to-report workflow so every client gets the same professional experience. You'll create a simple post-inspection follow-up — a thank-you, a request for a review, and a gentle ask for referrals. You'll review what worked in your first three weeks and double down on it. And you'll set three concrete 90-day goals so you leave this course with a clear direction.",
        "By the end of Day 30 you won't have a finished business — you'll have a working one, with a foundation, visibility, a lead flywheel, and the systems to keep it all running. That's the quick win this plan is built to deliver."
      ]
    },
    {
      id: 4, module: "Module 1", moduleTitle: "Brand & Identity",
      title: "Stand Out Strong — Building a Memorable Home Inspection Brand", duration: "18 min",
      content: [
        "Your brand is the first impression every potential client gets before they ever meet you. As a new home inspector, you're entering a market where many inspectors look and sound alike — same website templates, same stock photos, same generic taglines. The inspectors who win consistently are the ones who stand out clearly and memorably from day one. In this lesson, we'll build the foundation of your brand identity: your name, your logo concept, your color story, and the single sentence that tells a homeowner exactly who you are and why you're different.",
        "A strong brand is not a logo — it's a promise. It's the feeling a client gets when they think of you, and the reputation that precedes you into every appointment. We'll work through how to choose a business name that's easy to remember and say, how to pick colors and visuals that signal trust and professionalism, and how to write a positioning statement that makes you the obvious choice for the clients you most want to serve.",
        "By the end of this lesson you'll have the building blocks of a brand that feels intentional and credible, not thrown together. You don't need a big budget — you need clarity and consistency. The inspector who shows up the same way, everywhere, every time, builds recognition fast. That recognition is what turns a stranger's quick search into a booked inspection."
      ]
    },
    {
      id: 5, module: "Module 2", moduleTitle: "Work-Life Balance",
      title: "Balance & Success — How Home Inspectors Can Avoid Burnout", duration: "22 min",
      content: [
        "Burnout is the silent killer of new inspection businesses. In your eagerness to grow, it's tempting to say yes to every inspection, answer the phone at all hours, and drive across three counties for a single job. It feels like hustle — but it's a fast track to exhaustion, sloppy reports, and the resentment that makes people quit a business they once loved.",
        "This lesson reframes balance as a business strategy, not a luxury. A rested inspector writes better reports, communicates more clearly, and makes fewer costly mistakes. We'll cover how to set realistic daily inspection limits, how to define your service area so you're not living in your truck, and how to build buffer time so a complex inspection doesn't blow up your whole day.",
        "We'll also talk about the mindset shift: you are building a business that serves your life, not a life that serves your business. Setting boundaries early — on hours, on travel, on the kinds of jobs you take — protects both your health and your reputation. The inspectors who last for decades aren't the ones who worked the hardest in year one. They're the ones who built a pace they could sustain."
      ]
    },
    {
      id: 6, module: "Module 3", moduleTitle: "Time Management",
      title: "Master Your Schedule — Time Blocking for Busy Home Inspectors", duration: "19 min",
      content: [
        "A home inspector's day is deceptively complex: inspections, drive time, report writing, client calls, agent follow-ups, marketing, and the endless small administrative tasks that eat your evenings. Without a system, the urgent always crowds out the important, and your business stalls. Time blocking is the simplest, most powerful fix.",
        "In this lesson you'll learn to divide your week into dedicated blocks: inspection blocks, report-writing blocks, communication blocks, and growth blocks for marketing and follow-up. We'll cover why batching similar tasks dramatically reduces the mental cost of switching, and how protecting a daily report-writing window keeps you from falling days behind — the number-one complaint clients and agents have about inspectors.",
        "We'll build a realistic weekly template you can actually stick to, including buffer time for the inevitable surprises. The goal isn't to schedule every minute — it's to make sure the activities that grow your business get time before the day fills up with everything else. Master your schedule and you stop reacting to your business and start running it."

    },
    {
      id: 7, module: "Module 4", moduleTitle: "Revenue Diversification",
      title: "Diversifying Your Home Inspection Business — Should You Add Ancillary Services?", duration: "24 min",
      content: [
        "Relying on a single service at a single price is the most fragile way to run an inspection business. Ancillary services — radon testing, mold sampling, sewer scopes, thermal imaging, water testing, wind mitigation — let you increase your average ticket without finding new clients. The same appointment becomes worth significantly more, and the client gets a more complete picture of the home.",
        "But not every add-on makes sense for every market or every inspector. This lesson gives you a framework for deciding which ancillary services to offer: local demand, certification and equipment costs, your time per add-on, liability exposure, and the margin each service actually delivers. We'll look at which services tend to have the fastest payback and how to bundle them so clients see value rather than a list of upsells.",
        "We'll also cover how to introduce ancillary services without feeling pushy — positioning them as a more thorough inspection rather than a sales pitch. Done right, diversification raises your revenue per job, smooths out seasonal slumps, and makes your business far more resilient when any single revenue stream slows down."

    {

        "For decades, home inspectors built their entire businesses on buyer-agent referrals. It was simple and it worked — until the ground shifted. Depending on a single source of referrals means that when that source dries up, so does your income. The inspectors who thrive build a diversified referral network with many doors leading to their business.",
        "This lesson maps out the full universe of referral partners beyond buyer agents: listing agents, real estate attorneys, lenders and mortgage brokers, insurance agents, contractors and trades, property managers, and past clients themselves. Each of these touches home buyers and sellers and can send you a steady stream of work — if you build a real relationship rather than just dropping off business cards.",
        "We'll cover how to identify the right partners, how to offer genuine value before you ask for anything, and how to stay top of mind without being a pest. A network of twenty diverse partners each sending you a few referrals a year is far more stable than two agents sending you everything. Build that network now, while you have the time, and you'll never be at the mercy of a single source again."
      ]
    },
    {

        "This lesson lays out concrete strategies for a slow market: leaning into pre-listing and seller inspections that don't depend on a sale closing, expanding ancillary services to grow revenue per job, deepening relationships with the referral partners who still have business, and sharpening your marketing while competitors go quiet. A downturn is when market share is most available — because so many inspectors stop trying.",
        "We'll also address mindset and cash management, because a resilient business is built before the downturn, not during it. Keeping a financial buffer, controlling fixed costs, and staying visible all let you ride out slow stretches and emerge stronger. Markets always recover — and the inspectors who kept showing up are the ones positioned to win when they do."
      ]
    },
    {

      content: [
        "The home inspection industry has operated on the same basic model for 30 years: buyer agents refer you, you show up, you inspect, you get paid. It worked — until it didn't. The Sitzer-Burnett verdict, the rise of direct consumer marketing, and the shift toward seller-side inspections have quietly been dismantling that model. Inspectors who don't adapt aren't just leaving money on the table — they're building businesses on a foundation that is actively eroding. This lesson is a wake-up call, but it's also a roadmap.",

        "The point isn't fear — it's awareness. Every disruption that threatens the old model creates openings for inspectors willing to evolve. The rest of this series shows you exactly how to position yourself on the right side of these shifts, so that when the old model finishes fading, you're already operating in the new one."
      ]

    {
      id: 11, module: "Module 7", moduleTitle: "Industry Disruption — Adapt or Die",

      content: [
        "The forces reshaping real estate don't stay contained to agents and brokerages — they ripple straight into your inspection business. When commission structures change, when buyers shop differently, and when technology rewrites how deals get done, every service provider downstream feels it. This lesson helps you honestly assess whether you're positioned to ride these changes or be swept under by them.",
        "We'll walk through a simple self-assessment: How concentrated are your referral sources? How visible are you to consumers directly? How dependent is your income on buyer-side transactions specifically? Each answer reveals where you're exposed. The more of your business that hinges on one shrinking channel, the more risk you carry — even if things feel fine today.",

  var TOTAL = LESSONS.length; // 26

  // ── State ──
  function getCompleted() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch (e) { return []; }
  }
  function saveCompleted(arr) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
  }
  function isCompleted(id) { return getCompleted().indexOf(id) !== -1; }

  function getCurrentLessonIndex() {
    var raw = new URLSearchParams(window.location.search).get('lesson');
    var n = parseInt(raw, 10);
    if (isNaN(n) || n < 0 || n >= TOTAL) return 0;
    return n;
  }

  var current = getCurrentLessonIndex();

  // ── Render lesson content ──
  function renderLesson() {
    var L = LESSONS[current];
    document.getElementById('moduleLabel').textContent = L.module + ' · ' + L.moduleTitle;
    document.getElementById('lessonTitle').textContent = L.title;
    document.getElementById('playerTitle').textContent = L.title;
    document.getElementById('playerDur').textContent = L.duration;
    var textEl = document.getElementById('lessonText');
    textEl.innerHTML = L.content.map(function(p){ return '<p>' + p + '</p>'; }).join('');

    // reset player
    stopPlayback();

    // complete button state
    updateCompleteBtn();

    // nav button states
    document.getElementById('prevBtn').disabled = (current === 0);
    document.getElementById('nextBtn').disabled = (current === TOTAL - 1);

    // sidebar active + scroll
    updateSidebarActive();
    document.querySelector('.lesson-main').scrollTop = 0;
  }

  function updateCompleteBtn() {
    var btn = document.getElementById('completeBtn');
    var label = document.getElementById('completeLabel');
    if (isCompleted(LESSONS[current].id)) {
      btn.classList.add('done');
      label.textContent = 'Completed';
    } else {
      btn.classList.remove('done');
      label.textContent = 'Mark as Complete';
    }
  }

  // ── Progress bar ──
  function updateProgress() {
    var done = getCompleted().length;
    var pct = Math.round((done / TOTAL) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressPct').textContent = pct + '%';
    document.getElementById('progressCount').textContent = 'Your Progress: ' + done + ' / ' + TOTAL + ' lessons';
  }

  // ── Mark complete ──
  function markComplete() {
    var id = LESSONS[current].id;
    var arr = getCompleted();
    if (arr.indexOf(id) === -1) {
      arr.push(id);
      saveCompleted(arr);
    }
    updateCompleteBtn();
    updateProgress();
    // update sidebar checkbox for this lesson
    var row = document.querySelector('.sb-lesson[data-id="' + id + '"]');
    if (row) row.classList.add('completed');
  }

  // ── Navigation ──
  function goTo(index) {
    if (index < 0 || index >= TOTAL) return;
    current = index;
    var url = window.location.pathname + '?lesson=' + index;
    history.pushState({ lesson: index }, '', url);
    renderLesson();
  }
  function goPrev() { goTo(current - 1); }
  function goNext() { goTo(current + 1); }

  window.addEventListener('popstate', function() {
    current = getCurrentLessonIndex();
    renderLesson();
  });

  // ── Fake audio playback ──
  var playing = false;
  var playTimer = null;
  var playPos = 0;
  function togglePlay() {
    if (playing) { stopPlayback(); }
    else { startPlayback(); }
  }
  function startPlayback() {
    playing = true;
    document.getElementById('playIcon').innerHTML = '<rect x="6" y="5" width="4" height="14"></rect><rect x="14" y="5" width="4" height="14"></rect>';
    document.getElementById('playBtn').setAttribute('aria-label', 'Stop');
    playTimer = setInterval(function() {
      playPos += 0.8;
      if (playPos >= 100) {
        playPos = 100;
        document.getElementById('playTrackFill').style.width = '100%';
        stopPlayback();
        return;
      }
      document.getElementById('playTrackFill').style.width = playPos + '%';
    }, 120);
  }
  function stopPlayback() {
    playing = false;
    if (playTimer) { clearInterval(playTimer); playTimer = null; }
    playPos = 0;
    document.getElementById('playTrackFill').style.width = '0%';
    document.getElementById('playIcon').innerHTML = '<path d="M8 5v14l11-7z"></path>';
    document.getElementById('playBtn').setAttribute('aria-label', 'Play');
  }

  // ── Build sidebar (grouped by module) ──
  var SB_MODULES = [];
  (function buildModuleGroups() {
    var lastKey = null, group = null;
    LESSONS.forEach(function(L) {
      var key = L.module;
      if (key !== lastKey) {
        group = { module: L.module, moduleTitle: L.moduleTitle, lessons: [] };
        SB_MODULES.push(group);
        lastKey = key;
      }
      group.lessons.push(L);
    });
  })();

  var CHECK_SVG = '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>';
  var CLOCK_SVG = '<svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M12 7v5l3 2"/></svg>';

  function renderSidebar() {
    var body = document.getElementById('sidebarBody');
    var completed = getCompleted();
    var activeModuleIdx = -1;
    var html = '';
    SB_MODULES.forEach(function(mod, mi) {
      var hasActive = mod.lessons.some(function(L){ return L.id === LESSONS[current].id; });
      if (hasActive) activeModuleIdx = mi;
      var openClass = hasActive ? ' open' : '';
      html += '<div class="sb-module' + openClass + '" data-mi="' + mi + '">';
      html += '<div class="sb-mod-header" onclick="toggleSbModule(this)">';
      html += '<span class="sb-tri">&#9654;</span>';
      html += '<span class="sb-mod-title">' + mod.module + ': ' + mod.moduleTitle + '</span>';
      html += '</div><div class="sb-body">';
      mod.lessons.forEach(function(L) {
        var compClass = completed.indexOf(L.id) !== -1 ? ' completed' : '';
        var actClass = L.id === LESSONS[current].id ? ' active' : '';
        html += '<a class="sb-lesson' + compClass + actClass + '" data-id="' + L.id + '" href="?lesson=' + L.id + '" onclick="return sbClick(event,' + L.id + ')">';
        html += '<span class="sb-check">' + CHECK_SVG + '</span>';
        html += '<span class="sb-l-info">';
        html += '<span class="sb-l-title">' + L.title + '</span>';
        html += '<span class="sb-l-dur">' + CLOCK_SVG + ' ' + L.duration + '</span>';
        html += '</span></a>';
      });
      html += '</div></div>';
    });
    body.innerHTML = html;
  }

  function toggleSbModule(headerEl) {
    headerEl.parentElement.classList.toggle('open');
  }

  function sbClick(e, id) {
    e.preventDefault();
    goTo(id);
    return false;
  }

  function updateSidebarActive() {
    document.querySelectorAll('.sb-lesson').forEach(function(row) {
      row.classList.toggle('active', parseInt(row.getAttribute('data-id'),10) === LESSONS[current].id);
    });
    // ensure active module is open + scroll into view
    var activeRow = document.querySelector('.sb-lesson.active');
    if (activeRow) {
      var modEl = activeRow.closest('.sb-module');
      if (modEl) modEl.classList.add('open');
      activeRow.scrollIntoView({ block: 'nearest' });
    }
  }

  // ── Expand / collapse all ──
  var allExpanded = false; // sidebar starts with only active module open
  function toggleAll() {
    allExpanded = !allExpanded;
    document.querySelectorAll('.sb-module').forEach(function(m) {
      m.classList.toggle('open', allExpanded);
    });
    document.getElementById('toggleAllBtn').textContent = allExpanded ? 'Collapse all' : 'Expand all';
    if (!allExpanded) updateSidebarActive(); // keep active module open
  }

  // ── Init ──
  renderSidebar();
  renderLesson();
  updateProgress();
</script>
