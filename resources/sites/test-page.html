<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Inspector Playbook — Test Page</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .badge {
      display: inline-block;
      background: #f59e0b;
      color: #0f172a;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      line-height: 1.1;
      text-align: center;
      margin-bottom: 1rem;
    }

    h1 span {
      color: #f59e0b;
    }

    p.tagline {
      font-size: 1.15rem;
      color: #94a3b8;
      text-align: center;
      max-width: 480px;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }

    .cta {
      display: inline-block;
      background: #f59e0b;
      color: #0f172a;
      font-weight: 700;
      font-size: 1rem;
      padding: 0.85rem 2rem;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .cta:hover { opacity: 0.85; }

    footer {
      margin-top: 4rem;
      font-size: 0.8rem;
      color: #475569;
    }
  </style>
</head>
<body>
  <span class="badge">Live Test Page</span>
  <h1>Rebuild Smarter.<br /><span>Grow Faster.</span></h1>
  <p class="tagline">
    The Inspector Playbook — professional development courses built exclusively for home inspectors across the US and Canada.
  </p>
  <a class="cta" href="https://theinspectorplaybook.com" target="_blank">Visit The Inspector Playbook</a>
  <footer>theinspectorplaybook.com &nbsp;|&nbsp; Test page generated 2026-06-16</footer>
</body>
</html>
